[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/.local/share/Odoo/addons/16.0,/mnt/extra-addons 

server_wide_modules = base,web,dbfilter_from_header

admin_passwd = qvjs-m7wr-i9jg

; Important security restriction in production!
;list_db = False

; Set the database host, port, user, and password using environment variables in the docker-compose script. DB name has to be set mamnually!
;db_name = robobo_odoo
;defaultdb 
;db_sslmode=require

# Lista explícita de BDs Odoo neste servidor.
# Em Odoo 16, se definires dbfilter (regex), list_dbs() IGNORA db_name e enumera
# todas as bases PostgreSQL cujo dono é o mesmo utilizador — o cron tenta
# ir_module_module em cada uma (ex. receevi_production, defaultdb → ruído/erro).
# Sem dbfilter no ficheiro, list_dbs usa só db_name; o roteamento por domínio
# fica no Traefik (X-Odoo-dbfilter + módulo dbfilter_from_header).
# Integração FastAPI: ODOO_DB=robobo. Chatwoot: Postgres à parte (receevi_prod).
db_name = lfc_final,robobo,maisvida

;Optimization Settings for production -- May need to be reviewed based on spoecific environment requirements
;limit_memory_hard = 1024
;limit_memory_soft = 629145600
;limit_request = 8192
limit_time_cpu = 3600
limit_time_real = 3600
max_cron_threads = 1
workers = 2

proxy_mode = True

# Máximo de ligações por processo Odoo ao PostgreSQL. Em workers multiplicam-se:
# ~ (workers + 1) processos HTTP/cron × db_maxconn → não pode exceder o limite do
# cluster DO (painel: Connection Pools / max_connections), menos outras apps.
# 100 com workers=2 estoura planos pequenos → FATAL "remaining connection slots
# are reserved for non-replication superuser". Ajusta conforme o plano (ex.: 8–16).-
db_maxconn = 16
