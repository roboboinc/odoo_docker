services:
  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    networks:
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  odoo:
    #container_name: odoo
    image: roboboinc/odoo16:latest #127.0.0.1:5000/odoostack
    # build: .  # Commented out - using pre-built image in production
    volumes:
        - ./addons-extra:/mnt/extra-addons
        - ./config:/etc/odoo
        - odoo-web-data:/var/lib/odoo
    env_file:
        - .env
    networks:
      - traefik-network
    deploy:
      replicas: 1  # Define the number of replicas
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      # HTTP Service (port 8069)
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"
      # WebSocket Service (port 8072 for longpolling)
      - "traefik.http.services.odoo-longpolling.loadbalancer.server.port=8072"
      
      # Middleware for odoo.robobo.org
      - "traefik.http.routers.odoo-robobo.rule=Host(`odoo.robobo.org`)"
      - "traefik.http.middlewares.robobo-headers.headers.customrequestheaders.X-Odoo-dbfilter=robobo"
      - "traefik.http.routers.odoo-robobo.middlewares=gzip,sslheader,limit,robobo-headers"
      - "traefik.http.routers.odoo-robobo.entrypoints=websecure"
      - "traefik.http.routers.odoo-robobo.tls.certresolver=myresolver"
      - "traefik.http.routers.odoo-robobo.priority=1"
      # Longpolling/WebSocket router for odoo.robobo.org
      - "traefik.http.routers.odoo-robobo-longpolling.rule=Host(`odoo.robobo.org`) && (PathPrefix(`/websocket`) || PathPrefix(`/longpolling`))"
      - "traefik.http.routers.odoo-robobo-longpolling.service=odoo-longpolling"
      - "traefik.http.routers.odoo-robobo-longpolling.middlewares=robobo-headers"
      - "traefik.http.routers.odoo-robobo-longpolling.entrypoints=websecure"
      - "traefik.http.routers.odoo-robobo-longpolling.tls.certresolver=myresolver"
      - "traefik.http.routers.odoo-robobo-longpolling.priority=10"
      
      # Middleware for odoo.linhafala.org.mz
      - "traefik.http.routers.odoo-lfc.rule=Host(`odoo.linhafala.org.mz`) || Host(`odoo.app.linhafala.org.mz`)"
      - "traefik.http.middlewares.lfc-headers.headers.customrequestheaders.X-Odoo-dbfilter=lfc_final"
      - "traefik.http.routers.odoo-lfc.middlewares=gzip,sslheader,limit,lfc-headers"
      - "traefik.http.routers.odoo-lfc.entrypoints=websecure"
      - "traefik.http.routers.odoo-lfc.tls.certresolver=myresolver"
      - "traefik.http.routers.odoo-lfc.priority=1"
      # Longpolling/WebSocket router for odoo.linhafala.org.mz
      - "traefik.http.routers.odoo-lfc-longpolling.rule=(Host(`odoo.linhafala.org.mz`) || Host(`odoo.app.linhafala.org.mz`)) && (PathPrefix(`/websocket`) || PathPrefix(`/longpolling`))"
      - "traefik.http.routers.odoo-lfc-longpolling.service=odoo-longpolling"
      - "traefik.http.routers.odoo-lfc-longpolling.middlewares=lfc-headers"
      - "traefik.http.routers.odoo-lfc-longpolling.entrypoints=websecure"
      - "traefik.http.routers.odoo-lfc-longpolling.tls.certresolver=myresolver"
      - "traefik.http.routers.odoo-lfc-longpolling.priority=10"
      
      # Middleware for client-demo.odoo.robobo.org
      - "traefik.http.routers.odoo-demos.rule=Host(`client-demo.odoo.robobo.org`)"
      - "traefik.http.middlewares.demos-headers.headers.customrequestheaders.X-Odoo-dbfilter=maisvida"
      - "traefik.http.routers.odoo-demos.middlewares=gzip,sslheader,limit,demos-headers"
      - "traefik.http.routers.odoo-demos.entrypoints=websecure"
      - "traefik.http.routers.odoo-demos.tls.certresolver=myresolver"
      - "traefik.http.routers.odoo-demos.priority=1"
      # Longpolling/WebSocket router for client-demo.odoo.robobo.org
      - "traefik.http.routers.odoo-demos-longpolling.rule=Host(`client-demo.odoo.robobo.org`) && (PathPrefix(`/websocket`) || PathPrefix(`/longpolling`))"
      - "traefik.http.routers.odoo-demos-longpolling.service=odoo-longpolling"
      - "traefik.http.routers.odoo-demos-longpolling.middlewares=demos-headers"
      - "traefik.http.routers.odoo-demos-longpolling.entrypoints=websecure"
      - "traefik.http.routers.odoo-demos-longpolling.tls.certresolver=myresolver"
      - "traefik.http.routers.odoo-demos-longpolling.priority=10"
      #================== middlewares ==================================
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.limit.buffering.memRequestBodyBytes=20971520"
      - "traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=20971520"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.X-Real-IP=remote_addr"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.X-Forwarded-For=remote_addr"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.Host=host"
      - "traefik.http.routers.odoo.middlewares=odoo-headers"

  # Receevi (Chatwoot Community Edition) - Open Source Omnichannel Platform
  # Note: Connects to external Digital Ocean PostgreSQL database via .env config
  receevi-web:
    image: chatwoot/chatwoot:latest
    depends_on:
      - redis
    env_file:
        - .env
    volumes:
      - receevi_data:/app/storage
    networks:
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.receevi.loadbalancer.server.port=3000"
      - "traefik.http.routers.receevi-web.rule=Host(`oc.linhafala.org.mz`)"
      - "traefik.http.routers.receevi-web.entrypoints=websecure"
      - "traefik.http.routers.receevi-web.tls.certresolver=myresolver"
      - "traefik.http.routers.receevi-web.middlewares=gzip,sslheader,limit"

  # Receevi Sidekiq Worker
  receevi-sidekiq:
    image: chatwoot/chatwoot:latest
    depends_on:
      - redis
      - receevi-web
    env_file:
        - .env
    volumes:
      - receevi_data:/app/storage
    networks:
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # FastAPI Integration Service
  fastapi:
    build: ./fastapi
    image: fastapi-integration:latest
    depends_on:
      - redis
      - receevi-web
      - odoo
    env_file:
        - .env
    volumes:
      - ./fastapi:/app
    networks:
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.fastapi.loadbalancer.server.port=8000"
      - "traefik.http.routers.fastapi.rule=Host(`api.linhafala.org.mz`)"
      - "traefik.http.routers.fastapi.entrypoints=websecure"
      - "traefik.http.routers.fastapi.tls.certresolver=myresolver"

volumes:
    odoo-web-data:
      driver: local
    redis_data:
      driver: local
    receevi_data:
      driver: local

networks:
  traefik-network:
    external: true