
services:
  odoo:
    #container_name: odoo
    image: 127.0.0.1:5000/odoostack
    build: .
    # Disable cron threads on web pods; a separate cron service runs scheduled jobs
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--max-cron-threads=0"]
    volumes:
        # NOTE: For multi-node Swarm, back these with a shared/external volume (NFS/EFS/etc.)
        - addons-extra:/mnt/extra-addons:ro
        - odoo-filestore:/var/lib/odoo
    configs:
      - source: odoo_conf
        target: /etc/odoo/odoo.conf
        mode: 0444
    env_file:
        - .env
    environment:
      # S3-compatible attachment storage (DigitalOcean Spaces)
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-https://nyc3.digitaloceanspaces.com}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION:-nyc3}
    networks:
      - traefik-network
    deploy:
      replicas: 2  # Define the number of replicas
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"
      # Sticky sessions so authenticated users consistently hit the same pod
      - "traefik.http.services.odoo.loadbalancer.sticky.cookie.name=odoo_sticky"
      # WebSocket Headers Middleware
      - "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.Connection=Upgrade"
      - "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.Upgrade=websocket"
      # CORS Middleware for offline app
      - "traefik.http.middlewares.cors-allow-offline.headers.accesscontrolalloworigin=https://offline.linha1458.moz.wfp.org"
      - "traefik.http.middlewares.cors-allow-offline.headers.accesscontrolallowmethods=GET,OPTIONS,POST,PUT,DELETE"
      - "traefik.http.middlewares.cors-allow-offline.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors-allow-offline.headers.accesscontrolallowcredentials=true"
      # Middleware for odoo.robobo.org
      - "traefik.http.routers.odoo-robobo.rule=Host(`odoo.robobo.org`)"
      - "traefik.http.middlewares.robobo-headers.headers.customrequestheaders.X-Odoo-dbfilter=robobo"
      - "traefik.http.routers.odoo-robobo.middlewares=gzip,sslheader,limit,websocket-headers,robobo-headers,cors-allow-offline"
      - "traefik.http.routers.odoo-robobo.entrypoints=websecure"
      - "traefik.http.routers.odoo-robobo.tls.certresolver=myresolver"
      # Middleware for odoo.linhafala.org.mz
      - "traefik.http.routers.odoo-lfc.rule=Host(`odoo.linhafala.org.mz`) || Host(`odoo.app.linhafala.org.mz`)"
      - "traefik.http.middlewares.lfc-headers.headers.customrequestheaders.X-Odoo-dbfilter=lfc_final"
      - "traefik.http.routers.odoo-lfc.middlewares=gzip,sslheader,limit,websocket-headers,lfc-headers,cors-allow-offline"
      - "traefik.http.routers.odoo-lfc.entrypoints=websecure"
      - "traefik.http.routers.odoo-lfc.tls.certresolver=myresolver"
      # Middleware for client-demo.odoo.robobo.org.conf
      - "traefik.http.routers.odoo-demos.rule=Host(`client-demo.odoo.robobo.org`)"
      - "traefik.http.middlewares.demos-headers.headers.customrequestheaders.X-Odoo-dbfilter=maisvida"
      - "traefik.http.routers.odoo-demos.middlewares=gzip,sslheader,limit,websocket-headers,demos-headers,cors-allow-offline"
      - "traefik.http.routers.odoo-demos.entrypoints=websecure"
      - "traefik.http.routers.odoo-demos.tls.certresolver=myresolver"
      #================== middlewares ==================================
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.limit.buffering.memRequestBodyBytes=20971520"
      - "traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=20971520"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.X-Real-IP=remote_addr"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.X-Forwarded-For=remote_addr"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.Host=host"
      - "traefik.http.routers.odoo.middlewares=odoo-headers"
      - "traefik.http.middlewares.security-headers.headers.accesscontrolalloworigin=origin-list"
      - "traefik.http.middlewares.security-headers.headers.contentSecurityPolicy=default-src 'self'"
      - "traefik.http.middlewares.ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.ratelimit.ratelimit.burst=10"

  # Lightweight HTTP responder for /health. Traefik routes below ensure 200 OK
  # without touching Odoo, ideal for ALB/NLB health checks.
  health:
    image: traefik/whoami:v1.10.2
    networks:
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      # Generic catch-all: any host + /health
      - "traefik.http.routers.health.rule=Path(`/health`)"
      - "traefik.http.routers.health.entrypoints=websecure"
      - "traefik.http.routers.health.priority=1000"
      - "traefik.http.services.health.loadbalancer.server.port=80"

  # Dedicated cron worker (one replica) to avoid duplicate scheduled jobs across web pods
  odoo-cron:
    image: 127.0.0.1:5000/odoostack
    build: .
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--max-cron-threads=1"]
    networks:
      - traefik-network
    volumes:
      - addons-extra:/mnt/extra-addons:ro
      - odoo-filestore:/var/lib/odoo
    configs:
      - source: odoo_conf
        target: /etc/odoo/odoo.conf
        mode: 0444
    env_file:
      - .env
    environment:
      # S3-compatible attachment storage (DigitalOcean Spaces)
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-https://nyc3.digitaloceanspaces.com}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION:-nyc3}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  # For S3 attachments, filestore volume is no longer needed for file storage
  # but still used for temporary files and sessions. Can be node-local.
  odoo-filestore:
    driver: local
  addons-extra:
    external: true

networks:
  traefik-network:
    external: true
    driver: overlay

configs:
  # Swarm-friendly config distribution (replaces host bind mount of ./config)
  odoo_conf:
    file: ./config/odoo.conf
